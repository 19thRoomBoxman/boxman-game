<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ボックスマン工場</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 15px;
      background-color: #1a252f;
      color: #ecf0f1;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* 全体コンテナ */
    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 370px;
    }

    /* 全画面共通のステータス/タイトルバー */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      height: 48px;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
      background: #34495e;
      padding: 0 20px;
      border-radius: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      position: relative;
    }

    .status-bar-title {
      width: 100%;
      text-align: center;
      color: #f1c40f;
      font-size: 18px;
      letter-spacing: 1px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }

    .status-value {
      color: #f1c40f;
      font-size: 20px;
    }

    .timer-danger {
      color: #e74c3c !important;
      animation: blink 0.5s infinite alternate;
    }

    @keyframes blink {
      0% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    /* タイム追加 (+1秒) ポップアップ表示 */
    .time-bonus-popup {
      position: absolute;
      top: -20px;
      right: 10px;
      color: #f1c40f;
      font-size: 18px;
      font-weight: 900;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      pointer-events: none;
      animation: bonusFloat 0.8s ease-out forwards;
      z-index: 100;
    }

    @keyframes bonusFloat {
      0% { opacity: 0; transform: translateY(5px) scale(0.8); }
      30% { opacity: 1; transform: translateY(-5px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-20px) scale(1); }
    }

    /* 画面切り替え管理 */
    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      height: 375px;
    }

    .screen.active {
      display: flex;
    }

    /* スタート画面 / リザルト画面パネル */
    .card-panel {
      background: #2c3e50;
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      border: 3px solid #34495e;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    /* タイトル画像表示エリア (横320px×縦240px・角丸なし) */
    .title-image-container {
      position: relative;
      width: 320px;
      height: 240px;
      border-radius: 0;
      overflow: hidden;
      background: #111820;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px solid #34495e;
    }

    .title-image-container img.bg-gif {
      width: 320px;
      height: 240px;
      border-radius: 0;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* タイトル上を流れるパーツ画像 */
    .flowing-part {
      position: absolute;
      width: 48px;
      height: 48px;
      z-index: 2;
      pointer-events: none;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: pixelated;
    }

    /* リザルト画面用：画像＋吹き出しのコンテナ */
    .result-comment-container {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      margin-bottom: 4px;
    }

    /* 65x65固定画像枠 */
    .result-avatar {
      width: 65px;
      height: 65px;
      min-width: 65px;
      min-height: 65px;
      background: transparent;
      border: none;
      box-shadow: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .result-avatar img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }

    /* 吹き出し */
    .speech-bubble {
      position: relative;
      background: #ecf0f1;
      color: #1a252f;
      border-radius: 10px;
      padding: 16px 28px;
      font-size: 14px;
      font-weight: bold;
      line-height: 1.4;
      text-align: left;
      flex: 1;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      white-space: pre-wrap;
    }

    .speech-bubble::before {
      content: '';
      position: absolute;
      left: -8px;
      top: 50%;
      transform: translateY(-50%);
      border-style: solid;
      border-width: 6px 8px 6px 0;
      border-color: transparent #ecf0f1 transparent transparent;
    }

    /* 常時表示する操作説明エリア */
    .instructions {
      background: #111820;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 15px;
      width: 100%;
      text-align: left;
      border-left: 4px solid #f1c40f;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* ボタン群グループ */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 240px;
    }

    .btn {
      background: linear-gradient(135deg, #f1c40f, #f39c12);
      color: #1a252f;
      font-size: 16px;
      font-weight: bold;
      padding: 10px 20px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.15s, background-color 0.2s;
      width: 100%;
    }

    .btn-secondary {
      background: linear-gradient(135deg, #95a5a6, #7f8c8d);
      color: #fff;
    }

    .btn:active {
      transform: scale(0.95);
    }

    /* リザルト表記 */
    .result-score-box {
      margin-top: 0px;
    }

    .result-label {
      font-size: 12px;
      color: #bdc3c7;
    }

    .result-score {
      font-size: 30px;
      font-weight: bold;
      color: #f1c40f;
      margin: 0;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .rank-title {
      font-size: 16px;
      font-weight: bold;
      color: #e67e22;
      margin-bottom: 2px;
    }

    /* パズルボード外枠 */
    .board-viewport {
      position: relative;
      background: #111820;
      padding: 10px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6), inset 0 0 10px rgba(0,0,0,0.8);
      border: 3px solid #34495e;
      touch-action: none;
      overflow: hidden;
      width: 370px;
      height: 375px;
    }

    /* 5x5グリッドボード */
    .board {
      display: grid;
      grid-template-columns: repeat(5, 65px);
      grid-template-rows: repeat(5, 65px);
      gap: 6px;
      width: 349px;
      height: 349px;
      position: relative;
    }

    /* セル（タイル） */
    .cell {
      width: 65px;
      height: 65px;
      border-radius: 0;
      border: none;
      box-shadow: none;
      background-color: transparent;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      position: absolute;
      top: 0;
      left: 0;
      transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.2s;
      will-change: transform;
      z-index: 1;

      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;

      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }

    .cell.has-image .cell-icon,
    .cell.has-image .cell-label {
      display: none;
    }

    .cell-icon {
      font-size: 22px;
      line-height: 1.1;
      pointer-events: none;
    }

    .cell-label {
      font-size: 12px;
      line-height: 1.1;
      font-weight: 900;
      pointer-events: none;
    }

    .cell.dragging {
      transition: none !important;
      z-index: 10 !important;
    }

    .part-head:not(.has-image) { background-color: #e74c3c; border-radius: 8px; }
    .part-body:not(.has-image) { background-color: #3498db; border-radius: 8px; }
    .part-legs:not(.has-image) { background-color: #2ecc71; border-radius: 8px; }

    .cell.selected {
      outline: 3px solid #f1c40f;
      outline-offset: -1px;
      z-index: 20;
    }

    .cell.assembling {
      animation: assembleAnim 0.35s ease-in forwards;
      z-index: 30;
    }

    @keyframes assembleAnim {
      0% { opacity: 1; }
      50% { filter: brightness(1.8) drop-shadow(0 0 10px #f1c40f); }
      100% { opacity: 0; filter: brightness(2); }
    }

    /* メッセージ・エフェクト */
    .toast-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 100;
    }

    .toast {
      background: rgba(46, 204, 113, 0.95);
      color: #fff;
      font-weight: bold;
      font-size: 20px;
      padding: 8px 18px;
      border-radius: 35px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      animation: toastPop 0.8s ease-out forwards;
      text-align: center;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toast-icon {
      width: 65px;
      height: 65px;
      object-fit: contain;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: pixelated;
    }

    @keyframes toastPop {
      0% { transform: scale(0.5); opacity: 0; }
      50% { transform: scale(1.1); opacity: 1; }
      70% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1) translateY(-20px); opacity: 0; }
    }

    @media (max-width: 400px) {
      .game-container {
        max-width: 300px;
      }
      .status-bar {
        height: 42px;
        font-size: 14px;
        margin-bottom: 10px;
      }
      .status-bar-title {
        font-size: 15px;
      }
      .screen {
        height: 285px;
      }
      .board-viewport {
        width: 300px;
        height: 285px;
        padding: 10px;
      }
      .board {
        grid-template-columns: repeat(5, 52px);
        grid-template-rows: repeat(5, 52px);
        gap: 5px;
        width: 280px;
        height: 280px;
      }
      .cell {
        width: 52px;
        height: 52px;
      }
      .cell-icon { font-size: 18px; }
      .cell-label { font-size: 10px; }
      .title-image-container {
        width: 250px;
        height: 187px;
      }
      .title-image-container img.bg-gif {
        width: 250px;
        height: 187px;
      }
      .result-avatar { width: 55px; height: 55px; min-width: 55px; min-height: 55px; }
      .speech-bubble { font-size: 12px; padding: 12px 10px; }
      .instructions { font-size: 11px; }
      .status-value { font-size: 16px; }
      .result-score { font-size: 24px; }
      .rank-title { font-size: 14px; }
      .btn { font-size: 14px; padding: 8px 16px; }
      .toast-icon { width: 45px; height: 45px; }
      .toast { font-size: 16px; }
    }
  </style>
</head>
<body>

  <div class="game-container">
    <!-- 共通ステータスバー -->
    <div class="status-bar" id="statusBar">
      <div class="status-bar-title" id="statusTitle">ロボット組み立てパズル</div>

      <div class="status-item" id="statusTimerGroup" style="display: none;">
        <span>残り時間:</span>
        <span class="status-value" id="timer">60</span>
        <span>秒</span>
      </div>
      <div class="status-item" id="statusScoreGroup" style="display: none;">
        <span>完成品:</span>
        <span class="status-value" id="score">0</span>
        <span>体</span>
      </div>
    </div>

    <!-- スタート画面 -->
    <div class="screen active" id="startScreen">
      <div class="card-panel">
        <div class="title-image-container" id="titleImageContainer">
          <span style="color: #7f8c8d; font-size: 14px;">[ タイトル画像領域 ]</span>
        </div>

        <div class="btn-group">
          <button class="btn" onclick="startGame()">スタート！</button>
        </div>
      </div>
    </div>

    <!-- ゲーム画面 -->
    <div class="screen" id="gameScreen">
      <div class="board-viewport">
        <div class="board" id="board"></div>
        <div class="toast-container" id="toastContainer"></div>
      </div>
    </div>

    <!-- リザルト画面 -->
    <div class="screen" id="resultScreen">
      <div class="card-panel">
        <div class="result-score-box">
          <div class="result-label">組み立てたボックスマン</div>
          <div class="result-score"><span id="finalScore">0</span> <span style="font-size: 18px;">体</span></div>
        </div>

        <div>
          <div class="rank-title" id="rankTitle">Eランク</div>
        </div>

        <div class="result-comment-container">
          <div class="result-avatar" id="resultAvatar">
            <span style="color: #7f8c8d; font-size: 10px;">65x65</span>
          </div>
          <div class="speech-bubble" id="rankMessage">
            コメントがここに入ります。
          </div>
        </div>

        <div class="btn-group">
          <button class="btn" onclick="startGame()">もう一度挑戦する</button>
          <button class="btn btn-secondary" onclick="goToStart()">タイトルに戻る</button>
        </div>
      </div>
    </div>

    <!-- 常時表示する操作説明 -->
    <div class="instructions">
      💡 <strong>ルール</strong><br>
      ・制限時間は <strong>60秒</strong>！（組み立て成功で <strong>+1秒</strong>）<br>
      ・行や列をドラッグでスライドさせて並び替えます。<br>
      ・縦に「<strong>頭 → 胴 → 足</strong>」が揃った箇所を上から下へドラッグ（または「頭」をタップ）して組み立てよう！
    </div>
  </div>

  <script>
    /* ===================================================
       ★ 各種アセット・ファイルパス設定エリア ★
       =================================================== */
    const CONFIG = {
      startImage: "images/title.gif",                      // タイトル画面画像 (GIF)
      titlePartsImages: [                                   // タイトル上を流れるパーツ画像8種
        "images/t_parts_00.png",
        "images/t_parts_01.png",
        "images/t_parts_02.png",
        "images/t_parts_03.png",
        "images/t_parts_04.png",
        "images/t_parts_05.png",
        "images/t_parts_06.png",
        "images/t_parts_07.png"
      ],
      resultImage: "images/result_icon.png",// リザルト画面用共通画像 (65x65px)
      headImage:  "images/head.png",        // 頭パーツ
      bodyImage:  "images/body.png",        // 胴パーツ
      legsImage:  "images/legs.png",        // 足パーツ
      toastIconImage: "images/toast_icon.png", // ポップアップ用アイコン (65x65px)
      bgmPath: "sounds/BGM_Main.mp3",      // メインBGMのファイルパス
      bgmResultPath: "sounds/BGM_Score.mp3",// リザルトBGMのファイルパス
      seAssemblePath: "sounds/SE_00.mp3",   // 組み立て効果音
      seSlidePath: "sounds/SE_01.mp3"       // スライド効果音
    };

    // 画像プリロード管理オブジェクト（読み込み成功状態をキャシュ）
    const imageCache = {};

    function preloadImages() {
      const urlsToLoad = [
        CONFIG.headImage,
        CONFIG.bodyImage,
        CONFIG.legsImage,
        CONFIG.startImage,
        CONFIG.resultImage,
        CONFIG.toastIconImage,
        ...CONFIG.titlePartsImages
      ];

      urlsToLoad.forEach(url => {
        if (!url || url.trim() === "") return;
        const img = new Image();
        img.src = url;
        img.onload = () => {
          imageCache[url] = true;
        };
        img.onerror = () => {
          imageCache[url] = false;
        };
      });
    }

    // ページロード時にプリロード開始
    preloadImages();

    const BOARD_SIZE = 5;
    const GAME_TIME = 60;

    const TYPES = [
      { id: 'head', label: '頭', icon: '🤖', class: 'part-head', imageKey: 'headImage' },
      { id: 'body', label: '胴', icon: '🎽', class: 'part-body', imageKey: 'bodyImage' },
      { id: 'legs', label: '足', icon: '🦵', class: 'part-legs', imageKey: 'legsImage' }
    ];

    let CELL_SIZE = 65;
    let GAP = 6;
    let STEP = CELL_SIZE + GAP;

    // BGM用Audioインスタンス
    let bgmAudio = null;
    let currentBgmPath = "";

    // 流れるパーツの制御変数
    let flowingPartsInterval = null;
    let activeFlowingParts = [];
    let isFirstPart = true; // 最初のパーツ判定フラグ

    function playSE(path) {
      if (!path) return;
      const se = new Audio(path);
      se.play().catch(err => {
        console.warn("【SE再生失敗】", path, err);
      });
    }

    function playBGM(path, isLoop = true) {
      if (!path) return;
      if (bgmAudio && currentBgmPath === path) return;

      stopBGM();

      bgmAudio = new Audio(path);
      bgmAudio.loop = isLoop;
      currentBgmPath = path;

      bgmAudio.play().catch(error => {
        console.warn("【BGM再生失敗】", path, error);
      });
    }

    function stopBGM() {
      if (bgmAudio) {
        bgmAudio.pause();
        bgmAudio.currentTime = 0;
        bgmAudio = null;
        currentBgmPath = "";
      }
    }

    function updateMetrics() {
      const isSmall = window.innerWidth <= 400;
      CELL_SIZE = isSmall ? 52 : 65;
      GAP = isSmall ? 5 : 6;
      STEP = CELL_SIZE + GAP;
    }
    updateMetrics();
    window.addEventListener('resize', () => {
      updateMetrics();
      renderBoardPositions(false);
    });

    function initTitleImage() {
      const container = document.getElementById('titleImageContainer');
      if (CONFIG.startImage && CONFIG.startImage.trim() !== "") {
        container.innerHTML = `<img src="${CONFIG.startImage}" class="bg-gif" alt="タイトル画像" onerror="this.parentElement.innerHTML='<span style=\'color:#7f8c8d;font-size:14px;\'>[ タイトル画像領域 ]</span>'">`;
      }
      startTitlePartsFlow();
    }

    /* タイトル画面パーツの流動処理 */
    function startTitlePartsFlow() {
      stopTitlePartsFlow();
      isFirstPart = true; // 初期化

      const container = document.getElementById('titleImageContainer');
      if (!container) return;

      // 0.1秒ごとの定期実行ループ
      flowingPartsInterval = setInterval(() => {
        const lastPart = activeFlowingParts[activeFlowingParts.length - 1];
        if (!lastPart || lastPart.x <= (320 - (48 + 2))) {
          spawnFlowingPart(container);
        }

        // 既存パーツの移動処理（0.1秒ごとに2px左へ）
        for (let i = activeFlowingParts.length - 1; i >= 0; i--) {
          const item = activeFlowingParts[i];
          item.x -= 2;
          item.elem.style.left = item.x + 'px';

          // 左端（パーツの横幅48px分）を完全に外れたら削除
          if (item.x < -48) {
            item.elem.remove();
            activeFlowingParts.splice(i, 1);
          }
        }
      }, 100);
    }

    function stopTitlePartsFlow() {
      if (flowingPartsInterval) {
        clearInterval(flowingPartsInterval);
        flowingPartsInterval = null;
      }
      activeFlowingParts.forEach(item => item.elem.remove());
      activeFlowingParts = [];
    }

    function spawnFlowingPart(container) {
      if (!CONFIG.titlePartsImages || CONFIG.titlePartsImages.length === 0) return;

      let selectedSrc = "";

      // 最初の1個目は「t_parts_00.png」で固定
      if (isFirstPart) {
        selectedSrc = CONFIG.titlePartsImages[0];
        isFirstPart = false;
      } else {
        // 2個目以降はランダム選択
        selectedSrc = CONFIG.titlePartsImages[Math.floor(Math.random() * CONFIG.titlePartsImages.length)];
      }
      
      const img = document.createElement('img');
      img.src = selectedSrc;
      img.className = 'flowing-part';
      img.style.top = '161px';  // Y座標161px固定
      img.style.left = '320px'; // 右端からスタート

      container.appendChild(img);

      activeFlowingParts.push({
        elem: img,
        x: 320
      });
    }

    initTitleImage();

    let grid = [];
    let cellElements = [];
    let score = 0;
    let timeLeft = GAME_TIME;
    let timerInterval = null;
    let isProcessing = false;
    let isGameActive = false;
    let isZeroGracePeriod = false;

    const boardElem = document.getElementById('board');
    const scoreElem = document.getElementById('score');
    const timerElem = document.getElementById('timer');
    const finalScoreElem = document.getElementById('finalScore');
    const rankTitleElem = document.getElementById('rankTitle');
    const rankMessageElem = document.getElementById('rankMessage');
    const toastContainer = document.getElementById('toastContainer');

    const statusTitleElem = document.getElementById('statusTitle');
    const statusTimerGroup = document.getElementById('statusTimerGroup');
    const statusScoreGroup = document.getElementById('statusScoreGroup');

    const startScreen = document.getElementById('startScreen');
    const gameScreen = document.getElementById('gameScreen');
    const resultScreen = document.getElementById('resultScreen');

    let nextId = 1;

    function showScreen(screen) {
      startScreen.classList.remove('active');
      gameScreen.classList.remove('active');
      resultScreen.classList.remove('active');
      screen.classList.add('active');

      if (screen === startScreen) {
        statusTitleElem.style.display = 'block';
        statusTitleElem.textContent = 'ロボット組み立てパズル';
        statusTimerGroup.style.display = 'none';
        statusScoreGroup.style.display = 'none';
        startTitlePartsFlow();
      } else if (screen === gameScreen) {
        statusTitleElem.style.display = 'none';
        statusTimerGroup.style.display = 'flex';
        statusScoreGroup.style.display = 'flex';
        stopTitlePartsFlow();
      } else if (screen === resultScreen) {
        statusTitleElem.style.display = 'block';
        statusTitleElem.textContent = 'RESULT';
        statusTimerGroup.style.display = 'none';
        statusScoreGroup.style.display = 'none';
        stopTitlePartsFlow();
      }
    }

    function getRandomType() {
      return TYPES[Math.floor(Math.random() * TYPES.length)].id;
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function getSupplementaryTypes() {
      const counts = { head: 0, body: 0, legs: 0 };

      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const cell = grid[r][c];
          if (cell && counts[cell.type] !== undefined) {
            counts[cell.type]++;
          }
        }
      }

      const sortedTypes = Object.keys(counts).sort((a, b) => {
        if (counts[a] === counts[b]) {
          return Math.random() - 0.5;
        }
        return counts[a] - counts[b];
      });

      const leastType = sortedTypes[0];
      const secondLeastType = sortedTypes[1];

      const result = [leastType, leastType, leastType, secondLeastType];
      return shuffleArray(result);
    }

    function getTypeObj(typeId) {
      return TYPES.find(t => t.id === typeId);
    }

    function goToStart() {
      if (timerInterval) clearInterval(timerInterval);
      stopBGM();
      isGameActive = false;
      showScreen(startScreen);
    }

    function startGame() {
      score = 0;
      timeLeft = GAME_TIME;
      isProcessing = false;
      isGameActive = true;
      isZeroGracePeriod = false;

      scoreElem.textContent = score;
      timerElem.textContent = timeLeft;
      timerElem.classList.remove('timer-danger');

      initBoard();
      showScreen(gameScreen);
      playBGM(CONFIG.bgmPath, true);

      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(updateTimer, 1000);
    }

    function updateTimer() {
      if (!isGameActive) return;

      if (timeLeft > 0) {
        timeLeft--;
        timerElem.textContent = timeLeft;

        if (timeLeft <= 10) {
          timerElem.classList.add('timer-danger');
        } else {
          timerElem.classList.remove('timer-danger');
        }
      } else {
        if (!isZeroGracePeriod) {
          isZeroGracePeriod = true;
        } else {
          endGame();
        }
      }
    }

    function getRankData(score) {
      if (score >= 60) {
        return { title: '🏆 Sランク（伝説のメカニック）', msg: 'フハハ！　ボックスマン軍団が\n世界を制する日は近い！' };
      } else if (score >= 50) {
        return { title: '🥇 Aランク（超達人メカニック）', msg: 'これだけの数なら\nミソラさんとも戦えますぞ！' };
      } else if (score >= 40) {
        return { title: '🥈 Bランク（一人前メカニック）', msg: '上々だ！　ボックスマン人形を\n買う権利をやろう！' };
      } else if (score >= 30) {
        return { title: '🥉 Cランク（中堅メカニック）', msg: '中々やりますな\n時給200ガッツで契約更新です' };
      } else if (score >= 20) {
        return { title: '🔧 Dランク（駆け出しメカニック）', msg: '次はもっとやれるように\n改造出術を始めましょう' };
      } else if (score >= 10) {
        return { title: '🌱 Eランク（見習いメカニック）', msg: '君は　あのルキョルより\nおっちょこちょいか？' };
      } else {
        return { title: 'Fランク（置物）', msg: 'NICE JOKE' };
      }
    }

    function updateResultAvatar() {
      const avatarContainer = document.getElementById('resultAvatar');
      const imgUrl = CONFIG.resultImage;

      if (imgUrl && imgUrl.trim() !== "") {
        avatarContainer.innerHTML = `<img src="${imgUrl}" alt="リザルト画像" onerror="this.parentElement.innerHTML='<span style=\'color:#7f8c8d;font-size:10px;\'>65x65</span>'">`;
      } else {
        avatarContainer.innerHTML = `<span style="color: #7f8c8d; font-size: 10px;">65x65</span>`;
      }
    }

    function endGame() {
      isGameActive = false;
      clearInterval(timerInterval);
      finalScoreElem.textContent = score;

      const rankData = getRankData(score);
      rankTitleElem.textContent = rankData.title;
      rankMessageElem.textContent = rankData.msg;

      updateResultAvatar();

      showScreen(resultScreen);
      playBGM(CONFIG.bgmResultPath, false);
    }

    function initBoard() {
      boardElem.innerHTML = '';
      grid = [];
      cellElements = [];

      let isBoardValid = false;
      let initialTypes = [];

      while (!isBoardValid) {
        initialTypes = [];
        const counts = { head: 0, body: 0, legs: 0 };

        for (let i = 0; i < BOARD_SIZE * BOARD_SIZE; i++) {
          const type = getRandomType();
          counts[type]++;
          initialTypes.push(type);
        }

        if (counts.head >= 2 && counts.body >= 2 && counts.legs >= 2) {
          isBoardValid = true;
        }
      }

      let index = 0;
      for (let r = 0; r < BOARD_SIZE; r++) {
        const row = [];
        for (let c = 0; c < BOARD_SIZE; c++) {
          const type = initialTypes[index++];
          const cellObj = createCellElement(type, r, c);
          row.push(cellObj);
        }
        grid.push(row);
      }
      renderBoardPositions(false);
    }

    function createCellElement(type, r, c) {
      const typeObj = getTypeObj(type);
      const elem = document.createElement('div');
      elem.className = `cell ${typeObj.class}`;
      
      const customImgUrl = CONFIG[typeObj.imageKey];

      // キャッシュ（プリロード済み）にあれば即時表示設定して一瞬のチラつきを防ぐ
      if (customImgUrl && customImgUrl.trim() !== "") {
        if (imageCache[customImgUrl] === true) {
          elem.style.backgroundImage = `url("${customImgUrl}")`;
          elem.classList.add('has-image');
        } else if (imageCache[customImgUrl] === undefined) {
          // 未ロードの場合は非同期で判定
          const imgTest = new Image();
          imgTest.onload = () => {
            imageCache[customImgUrl] = true;
            elem.style.backgroundImage = `url("${customImgUrl}")`;
            elem.classList.add('has-image');
          };
          imgTest.onerror = () => {
            imageCache[customImgUrl] = false;
          };
          imgTest.src = customImgUrl;
        }
      }

      const iconSpan = document.createElement('span');
      iconSpan.className = 'cell-icon';
      iconSpan.textContent = typeObj.icon;

      const labelSpan = document.createElement('span');
      labelSpan.className = 'cell-label';
      labelSpan.textContent = typeObj.label;

      elem.appendChild(iconSpan);
      elem.appendChild(labelSpan);

      const cellObj = {
        id: nextId++,
        type: type,
        elem: elem,
        r: r,
        c: c
      };

      boardElem.appendChild(elem);
      cellElements.push(cellObj);
      return cellObj;
    }

    function renderBoardPositions(animate = true) {
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const cellObj = grid[r][c];
          if (cellObj) {
            cellObj.r = r;
            cellObj.c = c;
            if (!animate) {
              cellObj.elem.classList.add('dragging');
            } else {
              cellObj.elem.classList.remove('dragging');
            }
            setCellPos(cellObj.elem, c * STEP, r * STEP);
            if (!animate) {
              cellObj.elem.offsetHeight;
              cellObj.elem.classList.remove('dragging');
            }
          }
        }
      }
    }

    function setCellPos(elem, x, y) {
      elem.style.transform = `translate3d(${x}px, ${y}px, 0)`;
    }

    let startX = 0, startY = 0;
    let startRow = -1, startCol = -1;
    let isDragging = false;
    let dragMode = null;
    let activeCells = [];
    let lastGridOffset = 0;

    boardElem.addEventListener('pointerdown', (e) => {
      if (!isGameActive || isProcessing) return;
      const targetCellElem = e.target.closest('.cell');
      if (!targetCellElem) return;

      const cellObj = cellElements.find(item => item.elem === targetCellElem);
      if (!cellObj) return;

      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
      startRow = cellObj.r;
      startCol = cellObj.c;
      dragMode = null;
      lastGridOffset = 0;

      boardElem.setPointerCapture(e.pointerId);
    });

    boardElem.addEventListener('pointermove', (e) => {
      if (!isDragging || !isGameActive || isProcessing) return;

      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      const absX = Math.abs(dx);
      const absY = Math.abs(dy);

      if (!dragMode) {
        if (absX < 8 && absY < 8) return;

        if (absY > absX) {
          if (dy > 0 && isAssembleStart(startRow, startCol)) {
            dragMode = 'assemble';
            highlightAssembleCandidate(startRow, startCol, true);
          } else {
            dragMode = 'shift_col';
            prepareShiftCol(startCol);
          }
        } else {
          dragMode = 'shift_row';
          prepareShiftRow(startRow);
        }
      }

      if (dragMode === 'shift_row') {
        updateShiftRow(dx);
      } else if (dragMode === 'shift_col') {
        updateShiftCol(dy);
      }
    });

    boardElem.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      highlightAssembleCandidate(startRow, startCol, false);

      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      if (!isGameActive || isProcessing) return;

      if (dragMode === 'assemble') {
        if (dy > 20) {
          tryAssemble(startRow, startCol);
        }
      } else if (dragMode === 'shift_row') {
        finishShiftRow(dx);
      } else if (dragMode === 'shift_col') {
        finishShiftCol(dy);
      } else {
        if (isAssembleStart(startRow, startCol)) {
          tryAssemble(startRow, startCol);
        }
      }
    });

    boardElem.addEventListener('pointercancel', () => {
      if (!isDragging) return;
      isDragging = false;
      highlightAssembleCandidate(startRow, startCol, false);
      if (dragMode === 'shift_row' || dragMode === 'shift_col') {
        renderBoardPositions(true);
      }
    });

    function prepareShiftRow(r) {
      activeCells = [];
      for (let c = 0; c < BOARD_SIZE; c++) {
        const cell = grid[r][c];
        cell.elem.classList.add('dragging');
        activeCells.push(cell);
      }
    }

    function checkAndPlaySlideSE(delta) {
      const currentGridOffset = Math.round(delta / STEP);
      if (currentGridOffset !== lastGridOffset) {
        playSE(CONFIG.seSlidePath);
        lastGridOffset = currentGridOffset;
      }
    }

    function updateShiftRow(dx) {
      checkAndPlaySlideSE(dx);

      const totalWidth = BOARD_SIZE * STEP;
      for (let c = 0; c < BOARD_SIZE; c++) {
        const cell = activeCells[c];
        let baseX = c * STEP;
        let newX = baseX + dx;

        newX = ((newX % totalWidth) + totalWidth) % totalWidth;
        if (newX > totalWidth - CELL_SIZE) {
          newX -= totalWidth;
        }

        setCellPos(cell.elem, newX, startRow * STEP);
      }
    }

    function finishShiftRow(dx) {
      const shiftAmount = Math.round(dx / STEP);
      const steps = ((shiftAmount % BOARD_SIZE) + BOARD_SIZE) % BOARD_SIZE;

      if (steps !== 0) {
        const row = grid[startRow];
        const newRow = new Array(BOARD_SIZE);
        for (let c = 0; c < BOARD_SIZE; c++) {
          const newC = (c + steps) % BOARD_SIZE;
          newRow[newC] = row[c];
        }
        grid[startRow] = newRow;
      }

      activeCells.forEach(cell => cell.elem.classList.remove('dragging'));
      renderBoardPositions(true);
    }

    function prepareShiftCol(c) {
      activeCells = [];
      for (let r = 0; r < BOARD_SIZE; r++) {
        const cell = grid[r][c];
        cell.elem.classList.add('dragging');
        activeCells.push(cell);
      }
    }

    function updateShiftCol(dy) {
      checkAndPlaySlideSE(dy);

      const totalHeight = BOARD_SIZE * STEP;
      for (let r = 0; r < BOARD_SIZE; r++) {
        const cell = activeCells[r];
        let baseY = r * STEP;
        let newY = baseY + dy;

        newY = ((newY % totalHeight) + totalHeight) % totalHeight;
        if (newY > totalHeight - CELL_SIZE) {
          newY -= totalHeight;
        }

        setCellPos(cell.elem, startCol * STEP, newY);
      }
    }

    function finishShiftCol(dy) {
      const shiftAmount = Math.round(dy / STEP);
      const steps = ((shiftAmount % BOARD_SIZE) + BOARD_SIZE) % BOARD_SIZE;

      if (steps !== 0) {
        const col = [];
        for (let r = 0; r < BOARD_SIZE; r++) col.push(grid[r][startCol]);
        
        for (let r = 0; r < BOARD_SIZE; r++) {
          const newR = (r + steps) % BOARD_SIZE;
          grid[newR][startCol] = col[r];
        }
      }

      activeCells.forEach(cell => cell.elem.classList.remove('dragging'));
      renderBoardPositions(true);
    }

    function isAssembleStart(r, c) {
      if (r > BOARD_SIZE - 3) return false;
      return grid[r][c].type === 'head' && 
             grid[r + 1][c].type === 'body' && 
             grid[r + 2][c].type === 'legs';
    }

    function highlightAssembleCandidate(r, c, enable) {
      if (!isAssembleStart(r, c)) return;
      for (let i = 0; i < 3; i++) {
        const cell = grid[r + i][c];
        if (cell) {
          if (enable) cell.elem.classList.add('selected');
          else cell.elem.classList.remove('selected');
        }
      }
    }

    async function tryAssemble(r, c) {
      if (!isAssembleStart(r, c)) return;

      isProcessing = true;

      playSE(CONFIG.seAssemblePath);

      for (let i = 0; i < 3; i++) {
        grid[r + i][c].elem.classList.add('assembling');
      }

      showToast('組み立て完了！');
      score++;
      scoreElem.textContent = score;

      timeLeft += 1;
      timerElem.textContent = timeLeft;
      showTimeBonusPopup();

      isZeroGracePeriod = false;
      if (timeLeft > 10) {
        timerElem.classList.remove('timer-danger');
      }

      await sleep(350);

      for (let i = 0; i < 3; i++) {
        const cell = grid[r + i][c];
        cell.elem.remove();
        cellElements = cellElements.filter(item => item !== cell);
        grid[r + i][c] = null;
      }

      const remainingCells = [];
      for (let row = 0; row < BOARD_SIZE; row++) {
        if (grid[row][c] !== null) {
          remainingCells.push(grid[row][c]);
        }
      }

      const missingCount = BOARD_SIZE - remainingCells.length;
      const candidateTypes = getSupplementaryTypes(); 

      const freshCells = [];
      for (let i = 0; i < missingCount; i++) {
        const type = candidateTypes[i];
        const targetRow = i - missingCount;
        const newCell = createCellElement(type, targetRow, c);
        
        newCell.elem.classList.add('dragging');
        setCellPos(newCell.elem, c * STEP, targetRow * STEP);
        newCell.elem.offsetHeight;
        newCell.elem.classList.remove('dragging');

        freshCells.push(newCell);
      }

      const updatedCol = [...freshCells, ...remainingCells];

      for (let row = 0; row < BOARD_SIZE; row++) {
        grid[row][c] = updatedCol[row];
      }

      await sleep(50);
      renderBoardPositions(true);

      isProcessing = false;
    }

    function showTimeBonusPopup() {
      const popup = document.createElement('div');
      popup.className = 'time-bonus-popup';
      popup.textContent = '+1';
      statusTimerGroup.appendChild(popup);

      setTimeout(() => {
        popup.remove();
      }, 800);
    }

    function showToast(text) {
      const toast = document.createElement('div');
      toast.className = 'toast';

      if (CONFIG.toastIconImage && CONFIG.toastIconImage.trim() !== "") {
        const img = document.createElement('img');
        img.className = 'toast-icon';
        img.src = CONFIG.toastIconImage;
        img.onerror = () => {
          img.replaceWith('🤖 ');
        };
        toast.appendChild(img);
      } else {
        toast.appendChild(document.createTextNode('🤖 '));
      }

      const textNode = document.createTextNode(text);
      toast.appendChild(textNode);

      toastContainer.appendChild(toast);

      setTimeout(() => {
        toast.remove();
      }, 800);
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }
  </script>
</body>
